<!------------------------------------------------------------------
    2단 카테고리 메뉴 (컴퓨존 스타일)  ·  모바일 전용  ·  자동 생성형
    ------------------------------------------------------------------
    · 운영자는 [상점관리 > 상품분류]에만 분류를 등록하면 됩니다. (코드 수정 X)
    · 헤더에 이미 렌더링된 카페24 상품분류(#category-lnb)를 읽어
      왼쪽=대분류 / 오른쪽=중분류·소분류 로 자동 구성합니다.
    · 여는 버튼 : 하단 네비 "카테고리"(.jy-catmenu-open) / 헤더 햄버거(.hd-menu).
    · 스타일은 header.css 에 포함(추가 로드 불필요).
    · 전제: category.html 이 표준 구조(#category-lnb .d1-wrap > .d1 > a,
      .d2-wrap > dl > dd > a, .d3-wrap ... dd > a)를 사용. 다르면 아래 셀렉터만 조정.
------------------------------------------------------------------->
<!-- [2단 메뉴 켜기] category_full_m(전체메뉴)을 실제 메뉴로 채운 뒤,
     아래 한 줄의 주석을 풀면 대·중·소 2단 메뉴로 자동 전환됩니다.
     (이 블록은 화면에 안 보이게 숨긴 채 데이터 소스로만 사용됩니다.)
<div style="display:none" aria-hidden="true"><!--@import(/_wg/import/category_full_m.html)--></div>
-->

<div class="jy-catmenu" id="jyCatmenu" aria-hidden="true" style="display:none"><!-- 안전장치: CSS 없어도 홈에 안 새어나옴 -->
    <div class="jy-catmenu-head">
        <strong>카테고리</strong>
        <button type="button" class="jy-catmenu-close" aria-label="닫기"><i class="xi-close"></i></button>
    </div>
    <div class="jy-catmenu-body">
        <ul class="jy-catmenu-rail"><!-- 대분류 자동 --></ul>
        <div class="jy-catmenu-pane"><!-- 중/소분류 자동 --></div>
    </div>
</div>

<script>
(function(){
  var menu=document.getElementById('jyCatmenu'); if(!menu) return;
  var rail=menu.querySelector('.jy-catmenu-rail'),
      pane=menu.querySelector('.jy-catmenu-pane'),
      built=false;

  function name(a){var c=a.cloneNode(true);
    c.querySelectorAll('h,s').forEach(function(e){e.remove();});
    return c.textContent.replace(/\s+/g,' ').trim();}
  function href(a){return (a && a.getAttribute('href')) || '#none';}
  function qsa(el,sel){try{return el.querySelectorAll(sel);}catch(e){return [];}}

  // ── 카테고리 파서 : #category-lnb(Layout_category) 를 읽기만 함(수정 X) ──
  // 배너(category_img / js-banner)는 제외, 중첩 서브분류가 있으면 함께 추출.
  function skip(n){return n.classList&&(n.classList.contains('category_img')||n.classList.contains('img'))
      ||n.hasAttribute&&(n.hasAttribute('js-banner-module')||n.hasAttribute('js-banner'));}
  function isItem(n){return n.classList&&(n.classList.contains('d1')||n.classList.contains('d2')||n.classList.contains('d3'))||n.tagName==='LI'||n.tagName==='DD';}
  function isWrap(n){return n.tagName==='UL'||n.tagName==='OL'||n.tagName==='DL'||(n.classList&&(n.classList.contains('d1-wrap')||n.classList.contains('d2-wrap')||n.classList.contains('d3-wrap')));}
  function collect(container){var out=[];Array.prototype.forEach.call(container.children,function(n){
    if(skip(n)) return; if(isItem(n)) out.push(n); else if(isWrap(n)) out=out.concat(collect(n));}); return out;}
  function anchorOf(item){for(var i=0;i<item.children.length;i++){if(item.children[i].tagName==='A')return item.children[i];} return item.querySelector('a');}
  function subOf(item){for(var i=0;i<item.children.length;i++){var c=item.children[i]; if(!skip(c)&&isWrap(c))return c;} return null;}

  function parse(){
    // 우선순위 : ① 전체메뉴(수동, 대·중·소 전체) → ② 상품분류(자동, 대분류)
    var root=document.querySelector('#category_full_m > li > ul')   // 전체메뉴 html버전(있으면 2단)
             ||document.querySelector('#category-lnb .d1-wrap')      // Layout_category(자동 1단)
             ||document.querySelector('#category-lnb ul')
             ||document.querySelector('#category-lnb')
             ||document.querySelector('.xans-layout-category');
    if(!root) return null;
    var cats=[];
    collect(root).forEach(function(d1){
      var a1=anchorOf(d1); if(!a1) return; var nm=name(a1)||(a1.getAttribute('title')||'').trim(); if(!nm) return;
      var subs=[], s1=subOf(d1);
      if(s1) collect(s1).forEach(function(d2){
        var a2=anchorOf(d2); if(!a2||!name(a2)) return;
        var items=[], s2=subOf(d2);
        if(s2) collect(s2).forEach(function(d3){var a3=anchorOf(d3); if(a3&&name(a3)) items.push({name:name(a3),href:href(a3)});});
        subs.push({name:name(a2),href:href(a2),items:items});
      });
      cats.push({name:nm,href:href(a1),subs:subs});
    });
    return cats.length?cats:null;
  }

  function build(){
    if(built) return true;
    var cats=parse(); if(!cats) return false;
    var body=menu.querySelector('.jy-catmenu-body'),
        anySub=cats.some(function(c){return c.subs.length;});
    if(anySub){                                   // 서브분류 있음 → 2단(레일+패널)
      body.classList.remove('simple');
      cats.forEach(function(c,i){
        rail.insertAdjacentHTML('beforeend','<li data-i="'+i+'"'+(i?'':' class="on"')+'><a href="#none">'+c.name+'</a></li>');
        var h='<div class="jy-catmenu-panel'+(i?'':' on')+'" data-i="'+i+'">';
        if(c.subs.length) c.subs.forEach(function(s){
          h+='<div class="jy-catmenu-group"><a class="jy-catmenu-gtit" href="'+s.href+'">'+s.name+'<i class="xi-angle-right g"></i></a>';
          s.items.forEach(function(it){h+='<a href="'+it.href+'">'+it.name+'</a>';});
          h+='</div>';
        });
        else h+='<div class="jy-catmenu-group"><a class="jy-catmenu-gtit" href="'+c.href+'">'+c.name+' 전체보기<i class="xi-angle-right g"></i></a></div>';
        pane.insertAdjacentHTML('beforeend', h+'</div>');
      });
    }else{                                        // 1단만 → 단일 리스트
      body.classList.add('simple');
      var h='<div class="jy-catmenu-panel on"><div class="jy-catmenu-list">';
      cats.forEach(function(c){h+='<a href="'+c.href+'">'+c.name+'<i class="xi-angle-right g"></i></a>';});
      pane.insertAdjacentHTML('beforeend', h+'</div></div>');
    }
    built=true; return true;
  }

  function open(){
    if(!build() && !pane.children.length){        // 분류를 못 읽으면 전체상품 폴백
      menu.querySelector('.jy-catmenu-body').classList.add('simple');
      pane.innerHTML='<div class="jy-catmenu-panel on"><div class="jy-catmenu-list"><a href="/product/list.html">전체상품<i class="xi-angle-right g"></i></a></div></div>';
    }
    menu.style.display='flex'; menu.classList.add('on'); menu.setAttribute('aria-hidden','false'); document.body.classList.add('hd-lock');
  }
  function close(){menu.style.display='none'; menu.classList.remove('on'); menu.setAttribute('aria-hidden','true'); document.body.classList.remove('hd-lock');}

  // 트리거 : 문서 전체에 위임 → include 순서/시점과 무관하게 동작
  document.addEventListener('click',function(e){
    if(e.target.closest('.jy-catmenu-open')){ e.preventDefault(); open(); return; }
    if(e.target.closest('.jy-catmenu-close')){ close(); return; }
    var li=e.target.closest('#jyCatmenu .jy-catmenu-rail li[data-i]');
    if(li){
      var i=li.getAttribute('data-i');
      rail.querySelectorAll('li').forEach(function(x){x.classList.toggle('on',x===li);});
      pane.querySelectorAll('.jy-catmenu-panel').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-i')===i);});
      pane.scrollTop=0;
    }
  });

  // 가능하면 미리 생성(분류 DOM이 준비됐을 때)
  if(document.readyState!=='loading') build();
  else document.addEventListener('DOMContentLoaded',build);
})();
</script>
